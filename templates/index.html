<html>
<head>
    <title>Binary to Hex</title>
</head>
<body>
    <form method="post">
        <input name="binary" placeholder="Enter binary">
        <button type="submit">Convert</button>
    </form>

    <!-- Display a value -->
    <h1>{{ answer }}</h1> 
    
    <!-- Apply logic  -->
    {% if recent_inputs %}
    <p>History : {{ recent_inputs | join(', ') }}</p>
    {% endif %}
</body>
</html>
