{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="mb-1">Conversion History</h1>
        <p class="text-muted mb-0">Your 20 most recent conversions</p>
    </div>


<a href="{{ url_for('index') }}" class="btn btn-primary">
    New Conversion
</a>


</div>

{% if recent_inputs %} <div class="row g-3">
{% for input in recent_inputs %} <div class="col-12 col-md-6 col-lg-4"> <div class="card h-100 shadow-sm"> <div class="card-body d-flex align-items-center"> <span class="badge bg-secondary me-3">
{{ loop.index }} </span>


                    <code class="fs-5">{{ input }}</code>
                </div>
            </div>
        </div>
    {% endfor %}
</div>


{% else %} <div class="alert alert-info mb-0">
No numbers have been converted yet. </div>
{% endif %}

{% endblock %}
