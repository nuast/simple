<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Binary to Hex</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card p-4 mx-auto" style="max-width: 500px;">
            <h1 class="h3 mb-4">Binary to Hex</h1>

            <form method="post">
                <div class="mb-3">
                    <label for="binary" class="form-label">
                        Binary number
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="binary"
                        name="binary"
                        placeholder="Enter binary"
                        pattern="[01]+"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Convert
                </button>
            </form>

            {% if answer %}
                <div class="alert alert-success mt-4">
                    Hexadecimal: <strong>{{ answer }}</strong>
                </div>
            {% endif %}

            {% if recent_inputs %}
                <h2 class="h5 mt-4">History</h2>

                <ul class="list-group">
                    {% for input in recent_inputs %}
                        <li class="list-group-item">
                            {{ input }}
                        </li>
                    {% endfor %}
                </ul>
            {% endif %}
        </div>
    </div>

</body>
</html>
