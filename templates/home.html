{% extends "base.html" %}

{% block content %}

<h1 class="mb-4">Number Converter</h1>

<form method="post">
    <div class="mb-3">
        <label for="conversion" class="form-label">Conversion</label>

        <select name="conversion" id="conversion" class="form-select">
            <option value="Denary → Binary">Denary to Binary</option>
            <option value="Denary → Hex">Denary to Hexadecimal</option>
            <option value="Denary → Octal">Denary to Octal</option>
            <option value="Binary → Denary">Binary to Denary</option>
            <option value="Binary → Hex">Binary to Hexadecimal</option>
            <option value="Binary → Octal">Binary to Octal</option>
            <option value="Hex → Denary">Hexadecimal to Denary</option>
            <option value="Hex → Binary">Hexadecimal to Binary</option>
            <option value="Hex → Octal">Hexadecimal to Octal</option>
            <option value="Octal → Denary">Octal to Denary</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="number" class="form-label">Number</label>

        <input
            type="text"
            name="number"
            id="number"
            class="form-control"
            placeholder="Enter a number"
            required
        >
    </div>

    <button type="submit" class="btn btn-primary">Convert</button>
</form>

{% if answer %}
    <h2 class="mt-4">Result: {{ answer }}</h2>
{% endif %}

{% endblock %}
